<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- FINAL: v13 hexagon layout | v31 ceiling line + flush-mount dome (trim bar removed) + rays | v31 serif FTC | v30 staggered planks | v32 name block with FLOORING • PLASTER • PAINT tagline -->
  <rect width="400" height="300" fill="#ffffff"/>

  <!-- Hexagon badge -->
  <polygon points="200,24 278,68 278,156 200,200 122,156 122,68" fill="#16191e"/>
  <polygon points="200,38 266,76 266,150 200,186 134,150 134,76" fill="none" stroke="#33608f" stroke-width="3"/>

  <!-- Ceiling line (v31) -->
  <rect x="162" y="64" width="76" height="3.5" fill="#dde4ea"/>

  <!-- Flush-mount dome light (v31, trim bar removed) -->
  <path d="M185,68 A15,13 0 0 0 215,68 Z" fill="#e8edf2"/>

  <!-- Light rays (v31) -->
  <line x1="192" y1="85" x2="188" y2="91" stroke="#dde4ea" stroke-width="2"/>
  <line x1="200" y1="86" x2="200" y2="92" stroke="#dde4ea" stroke-width="2"/>
  <line x1="208" y1="85" x2="212" y2="91" stroke="#dde4ea" stroke-width="2"/>

  <!-- Monogram (v31 font: Georgia 48, letter-spacing 2, silver) -->
  <text x="200" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" letter-spacing="2" fill="#c9d2da">FTC</text>

  <!-- Staggered floor planks (v30) -->
  <rect x="150" y="146" width="50" height="10" fill="#dde4ea"/>
  <rect x="204" y="146" width="48" height="10" fill="#dde4ea"/>
  <rect x="166" y="158" width="32" height="10" fill="#a9805a"/>
  <rect x="202" y="158" width="30" height="10" fill="#dde4ea"/>
  <rect x="186" y="170" width="28" height="8" fill="#dde4ea"/>

  <!-- Name block (v32) with new tagline -->
  <text x="200" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#16191e">FLOOR TO CEILING</text>
  <text x="200" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="5" fill="#33608f">RESTORATIONS</text>
  <text x="200" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#4a5560">FLOORING &#8226; PLASTER &#8226; PAINT</text>
</svg>
